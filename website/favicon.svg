<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#08080c"/>

  <!-- Lens circle -->
  <circle cx="220" cy="215" r="110" fill="none" stroke="#00d4ff" stroke-width="24" opacity="0.9"/>

  <!-- Cost bars inside lens — descending, representing token breakdown -->
  <rect x="170" y="175" width="80" height="12" rx="6" fill="#ff4d4d" opacity="0.9"/>
  <rect x="170" y="199" width="56" height="12" rx="6" fill="#00e676" opacity="0.9"/>
  <rect x="170" y="223" width="36" height="12" rx="6" fill="#00d4ff" opacity="0.8"/>
  <rect x="170" y="247" width="18" height="12" rx="6" fill="#a78bfa" opacity="0.7"/>

  <!-- Handle -->
  <line x1="300" y1="298" x2="400" y2="398" stroke="#00d4ff" stroke-width="28" stroke-linecap="round" opacity="0.85"/>

  <!-- Slash through the biggest bar — the "cut" -->
  <line x1="164" y1="190" x2="258" y2="170" stroke="#00e676" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
